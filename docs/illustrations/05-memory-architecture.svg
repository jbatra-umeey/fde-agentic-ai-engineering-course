<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">5. Memory Architecture</title><desc id="desc">Connect current context, past interactions and external knowledge. Illustrated workflow with a step-by-step explanation.</desc>
