b4d" text-anchor="middle">Agent</text><text x="650.0" y="482" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Use context and tools</text><path d="M325 465H485" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="328.0" y="411" width="144" height="29" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="400" y="432" font-size="16" font-weight="600" fill="#52749b" text-anchor="middle">1. Input / Query</text><rect x="1010" y="245" width="340" height="420" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><text x="1180" y="285" font-size="26" font-weight="700" fill="#253650" text-anchor="middle">Memory System</text><rect x="1030" y="310" width="300" height="95" rx="12" fill="#f2edff" stroke="none" stroke-width="2"/><g transform="translate(1044,330) scale(0.65)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="12" rx="23" ry="8"/><path d="M9 12v38c0 11 46 11 46 0V12 M9 30c0 11 46 11 46 0 M9 43c0 11 46 11 46 0"/></g><text x="1120" y="347" font-size="19" font-weight="700" fill="#253650" text-anchor="start">Short-term Memory</text><text x="1120" y="378" font-size="17" font-weight="400" fill="#253650" text-anchor="start">Current session</text><rect x="1030" y="420" width="300" height="95" rx="12" fill="#fff8d9" stroke="none" stroke-width="2"/><g transform="translate(1044,440) scale(0.65)" fill="none" stroke="#b58815" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="12" rx="23" ry="8"/><path d="M9 12v38c0 11 46 11 46 0V12 M9 30c0 11 46 11 46 0 M9 43c0 11 46 11 46 0"/></g><text x="1120" y="457" font-size="19" font-weight="700" fill="#253650" text-anchor="start">Long-term Memory</text><text x="1120" y="488" font-size="17" font-weight="400" fill="#253650" text-anchor="start">Past interactions</text><rect x="1030" y="530" width="300" height="95" rx="12" fill="#ffeef5" stroke="none" stroke-width="2"/><g transform="translate(1044,550) scale(0.65)" fill="none" stroke="#b54c78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="12" rx="23" ry="8"/><path d="M9 12v38c0 11 46 11 46 0V12 M9 30c0 11 46 11 46 0 M9 43c0 11 46 11 46 0"/></g><text x="1120" y="567" font-size="19" font-weight="700" fill="#253650" text-anchor="start">Knowledge Base</text><text x="1120" y="598" font-size="17" font-weight="400" fill="#253650" text-anchor="start">External information</text><path d="M815 390H995" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="812.0" y="334" width="176" height="29" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="900" y="355" font-size="16" font-weight="600" fill="#52749b" text-anchor="middle">2. Retrieve memories</text><path d="M995 520H815" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="821.0" y="539" width="168" height="29" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="905" y="560" font-size="16" font-weight="600" fill="#52749b" text-anchor="middle">3. Relevant context</text><rect x="500" y="655" width="300" height="175" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(624.0,673) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h28l10 10v44H14Z M42 4v12h10 M23 26h20 M23 35h20 M23 44h13"/></g><text x="650.0" y="753" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Response</text><text x="650.0" y="787" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Answer using memory and</text><text x="650.0" y="813" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">tools</text><path d="M650 590V640" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="680" y="615" font-size="18" font-weight="600" fill="#253650" text-anchor="start">4. Generate</text>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">User input</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Understand the request and identify the information it needs.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Retrieve memory</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Search the current session, past interactions and knowledge base.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Use context</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Add the relevant retrieved information to the current context.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Generate response</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Combine the request, context and tool results into an answer.</text><rect x="40" y="1200" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1206" width="39" height="39" rx="20" fill="#ffeef5" stroke="none" stroke-width="2"/><text x="72.5" y="1234" font-size="22" font-weight="700" fill="#b54c78" text-anchor="middle">5</text><text x="111" y="1232" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Update memory</text><text x="470" y="1232" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Store appropriate useful information for future interactions.</text></g></svg>