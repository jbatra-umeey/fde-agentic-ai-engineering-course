<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">9. Human-in-the-Loop Design</title><desc id="desc">Combine human judgment with agent execution and explicit review. Illustrated workflow with a step-by-step explanation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#52749b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="1400" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="40" y="38" width="70" height="48" rx="24" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="75" y="71" font-size="27" font-weight="700" fill="#235c9b" text-anchor="middle">9</text><text x="132" y="70" font-size="18" font-weight="700" fill="#52749b" text-anchor="start">FDE AGENTIC AI ENGINEERING COURSE</text><text x="700" y="145" font-size="46" font-weight="700" fill="#10264b" text-anchor="middle">Human-in-the-Loop Design</text><text x="700" y="191" font-size="23" font-weight="400" fill="#52627b" text-anchor="middle">Combine human judgment with agent execution and explicit review.</text><rect x="40" y="225" width="212" height="42" rx="20" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="23" font-weight="700" fill="#235c9b" text-anchor="start">Flow diagram</text><rect x="70" y="300" width="360" height="220" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(224.0,318) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M12 54v-8c0-20 40-20 40 0v8Z"/></g><text x="250.0" y="398" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Human</text><text x="250.0" y="432" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Provide goals, context and</text><text x="250.0" y="458" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">initial input</text><rect x="520" y="300" width="360" height="220" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(674.0,318) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="17" width="48" height="36" rx="10"/><path d="M32 17V8M2 29v13M62 29v13M23 43h18"/><circle cx="32" cy="5" r="3"/><circle cx="22" cy="31" r="3"/><circle cx="42" cy="31" r="3"/></g><text x="700.0" y="398" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">AI Agent</text><text x="700.0" y="432" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Analyze, decide and take action</text><rect x="970" y="300" width="360" height="220" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(1124.0,318) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h28l10 10v44H14Z M42 4v12h10 M23 26h20 M23 35h20 M23 44h13"/></g><text x="1150.0" y="398" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Output</text><text x="1150.0" y="432" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Produce a result or</text><text x="1150.0" y="458" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">recommendation</text><path d="M445 410H505" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M895 410H955" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="520" y="625" width="360" height="190" rx="20" fill="#fff8d9" stroke="#b58815" stroke-width="2"/><g transform="translate(674.0,643) scale(0.8)" fill="none" stroke="#b58815" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M12 54v-8c0-20 40-20 40 0v8Z"/></g><text x="700.0" y="723" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Human Review</text><text x="700.0" y="757" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Check, validate and give</text><text x="700.0" y="783" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">feedback</text><path d="M1150 535V720H895" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M505 720H250V535" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Human sets the goal</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Provide the objective, context, constraints and preferences.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">AI agent takes action</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Analyze the input, plan the work and produce an output.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Human reviews the result</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Check accuracy, safety and quality; validate or request changes.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Iterate and improve</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Use the review to refine the next response or action.</text></g></svg>