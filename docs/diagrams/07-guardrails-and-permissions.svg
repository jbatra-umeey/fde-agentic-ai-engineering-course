<g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="1400" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="40" y="38" width="70" height="48" rx="24" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="75" y="71" font-size="27" font-weight="700" fill="#235c9b" text-anchor="middle">7</text><text x="132" y="70" font-size="18" font-weight="700" fill="#52749b" text-anchor="start">FDE AGENTIC AI ENGINEERING COURSE</text><text x="700" y="145" font-size="46" font-weight="700" fill="#10264b" text-anchor="middle">Guardrails &amp; Permissions</text><text x="700" y="191" font-size="23" font-weight="400" fill="#52627b" text-anchor="middle">Check the request and enforce access limits before tools or data are used.</text><rect x="40" y="225" width="212" height="42" rx="20" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="23" font-weight="700" fill="#235c9b" text-anchor="start">Flow diagram</text><rect x="50" y="285" width="280" height="220" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(164.0,303) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M12 54v-8c0-20 40-20 40 0v8Z"/></g><text x="190.0" y="383" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">User</text><text x="190.0" y="417" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Send a request</text><rect x="390" y="285" width="280" height="220" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(504.0,303) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m32 5 23 9v16c0 14-12 24-23 29C21 54 9 44 9 30V14Z M20 31l8 8 16-18"/></g><text x="530.0" y="383" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Guardrails</text><text x="530.0" y="417" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Check safety and policy</text><text x="530.0" y="443" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">rules</text><rect x="730" y="285" width="280" height="220" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(844.0,303) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="27" width="42" height="30" rx="5"/><path d="M19 27V17a13 13 0 0 1 26 0v10 M32 39v9"/></g><text x="870.0" y="383" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Permissions</text><text x="870.0" y="417" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Verify identity and</text><text x="870.0" y="443" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">allowed actions</text><rect x="1070" y="285" width="280" height="220" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(1184.0,303) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="17" width="48" height="36" rx="10"/><path d="M32 17V8M2 29v13M62 29v13M23 43h18"/><circle cx="32" cy="5" r="3"/><circle cx="22" cy="31" r="3"/><circle cx="42" cy="31" r="3"/></g><text x="1210.0" y="383" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Agent</text><text x="1210.0" y="417" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Execute within allowed</text><text x="1210.0" y="443" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">limits</text><path d="M340 395H375" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M680 395H715" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1020 395H1055" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1070" y="610" width="280" height="200" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(1184.0,628) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="12" rx="23" ry="8"/><path d="M9 12v38c0 11 46 11 46 0V12 M9 30c0 11 46 11 46 0 M9 43c0 11 46 11 46 0"/></g><text x="1210.0" y="708" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Tools / Data</text><text x="1210.0" y="742" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Access permitted</text><text x="1210.0" y="768" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">resources only</text><rect x="550" y="610" width="300" height="200" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(674.0,628) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h28l10 10v44H14Z M42 4v12h10 M23 26h20 M23 35h20 M23 44h13"/></g><text x="700.0" y="708" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Response</text><text x="700.0" y="742" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Return a controlled result</text><path d="M1210 520V595" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1055 710H865" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Guardrails check</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Check the request against the applicable safety and policy rules.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Permissions verify</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Verify identity and access to the required tools, apps and data.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Agent executes</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Perform the task using only permitted actions and resources.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Safe outcome</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Return the result within the allowed boundaries.</text><text x="45" y="1368" font-size="15" font-weight="400" fill="#65778f" text-anchor="start">Conceptual flows: supplied @aiwithanuj reference photos. Original vector artwork for this course.</text><text x="1355" y="1368" font-size="16" font-weight="700" fill="#52749b" text-anchor="end">07 / 10</text></g></svg>