<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">6. Orchestration Patterns</title><desc id="desc">Coordinate specialist agents to solve a larger task together. Flow and step-by-step explanation follow the user-supplied reference photo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#52749b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="1400" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="40" y="38" width="70" height="48" rx="24" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="75" y="71" font-size="27" font-weight="700" fill="#235c9b" text-anchor="middle">6</text><text x="132" y="70" font-size="18" font-weight="700" fill="#52749b" text-anchor="start">FDE AGENTIC AI ENGINEERING COURSE</text><text x="700" y="145" font-size="46" font-weight="700" fill="#10264b" text-anchor="middle">Orchestration Patterns</text><text x="700" y="191" font-size="23" font-weight="400" fill="#52627b" text-anchor="middle">Coordinate specialist agents to solve a larger task together.</text><rect x="40" y="225" width="212" height="42" rx="20" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="23" font-weight="700" fill="#235c9b" text-anchor="start">Flow diagram</text><rect x="40" y="415" width="240" height="215" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(134.0,433) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M12 54v-8c0-20 40-20 40 0v8Z"/></g><text x="160.0" y="513" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">User</text><text x="160.0" y="547" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Provide a task or</text><text x="160.0" y="573" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">goal</text><rect x="355" y="390" width="280" height="260" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(469.0,408) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 9c-8-10-21-2-18 9C1 21 3 36 12 39c-5 12 8 22 18 14V9Z M34 9c8-10 21-2 18 9 11 3 9 18 0 21 5 12-8 22-18 14V9Z M15 19l7 6-7 9 M49 19l-7 6 7 9 M19 47l5-7 M45 47l-5-7"/></g><text x="495.0" y="488" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Orchestrator</text><text x="495.0" y="522" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Plan, assign tasks,</text><text x="495.0" y="548" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">coordinate and manage</text><text x="495.0" y="574" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">flow</text><path d="M290 515H340" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="263.0" y="467" width="104" height="29" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="315" y="488" font-size="16" font-weight="600" fill="#52749b" text-anchor="middle">Task / Goal</text><rect x="775" y="240" width="310" height="590" rx="20" fill="#fbfdff" stroke="#9eb7cf" stroke-width="2"/><text x="930" y="280" font-size="25" font-weight="700" fill="#253650" text-anchor="middle">Agent Team</text><rect x="793" y="305" width="274" height="105" rx="12" fill="#e9faf3" stroke="none" stroke-width="2"/><g transform="translate(806,326) scale(0.62)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="27" cy="26" r="19"/><path d="m41 40 16 17"/></g><text x="860" y="342" font-size="21" font-weight="700" fill="#253650" text-anchor="start">Research Agent</text><text x="860" y="372" font-size="16" font-weight="400" fill="#253650" text-anchor="start">Gather information</text><rect x="793" y="430" width="274" height="105" rx="12" fill="#f2edff" stroke="none" stroke-width="2"/><g transform="translate(806,451) scale(0.62)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m22 16-15 16 15 16 M42 16l15 16-15 16 M36 10l-8 44"/></g><text x="860" y="467" font-size="21" font-weight="700" fill="#253650" text-anchor="start">Coding Agent</text><text x="860" y="497" font-size="16" font-weight="400" fill="#253650" text-anchor="start">Write and execute code</text><rect x="793" y="555" width="274" height="105" rx="12" fill="#fff8d9" stroke="none" stroke-width="2"/><g transform="translate(806,576) scale(0.62)" fill="none" stroke="#b58815" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6v49h48 M20 44V31h7v13 M34 44V21h7v23 M48 44V11h7v33"/></g><text x="860" y="592" font-size="21" font-weight="700" fill="#253650" text-anchor="start">Analysis Agent</text><text x="860" y="622" font-size="16" font-weight="400" fill="#253650" text-anchor="start">Analyze results</text><rect x="793" y="680" width="274" height="105" rx="12" fill="#ffeef5" stroke="none" stroke-width="2"/><g transform="translate(806,701) scale(0.62)" fill="none" stroke="#b54c78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h28l10 10v44H14Z M42 4v12h10 M23 26h20 M23 35h20 M23 44h13"/></g><text x="860" y="717" font-size="21" font-weight="700" fill="#253650" text-anchor="start">Planning Agent</text><text x="860" y="747" font-size="16" font-weight="400" fill="#253650" text-anchor="start">Break down complex</text><text x="860" y="768" font-size="16" font-weight="400" fill="#253650" text-anchor="start">tasks</text><path d="M650 455H760" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="705" y="420" font-size="17" font-weight="600" fill="#253650" text-anchor="middle">Assign tasks</text><path d="M760 585H650" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="705" y="620" font-size="17" font-weight="600" fill="#253650" text-anchor="middle">Return results</text><rect x="1160" y="420" width="200" height="210" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(1234.0,438) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="7" width="46" height="50" rx="7"/><path d="m19 30 9 9 19-20"/></g><text x="1260.0" y="518" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Result</text><text x="1260.0" y="552" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Complete solution</text><text x="1260.0" y="578" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">or response</text><path d="M1100 515H1145" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1125" y="465" font-size="16" font-weight="600" fill="#253650" text-anchor="middle">Final</text><text x="1125" y="489" font-size="16" font-weight="600" fill="#253650" text-anchor="middle">output</text>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Understand the task</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">The orchestrator breaks a complex goal into smaller steps.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Assign to agents</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Select the appropriate specialist for each part of the work.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Coordinate and monitor</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Run work in parallel or sequence and collect agent results.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Deliver final output</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Combine the results, verify the output and return the solution.</text></g></svg>