<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">3. Context Engineering</title><desc id="desc">Design and manage the information an LLM needs for a useful response. Flow and step-by-step explanation follow the user-supplied reference photo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#52749b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="1400" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="40" y="38" width="70" height="48" rx="24" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="75" y="71" font-size="27" font-weight="700" fill="#235c9b" text-anchor="middle">3</text><text x="132" y="70" font-size="18" font-weight="700" fill="#52749b" text-anchor="start">FDE AGENTIC AI ENGINEERING COURSE</text><text x="700" y="145" font-size="46" font-weight="700" fill="#10264b" text-anchor="middle">Context Engineering</text><text x="700" y="191" font-size="23" font-weight="400" fill="#52627b" text-anchor="middle">Design and manage the information an LLM needs for a useful response.</text><rect x="40" y="225" width="212" height="42" rx="20" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="23" font-weight="700" fill="#235c9b" text-anchor="start">Flow diagram</text><rect x="50" y="350" width="280" height="230" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(164.0,368) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M12 54v-8c0-20 40-20 40 0v8Z"/></g><text x="190.0" y="448" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">User Query</text><text x="190.0" y="482" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Plan a 7-day Japan trip</text><text x="190.0" y="508" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">on a $2,000 budget</text><rect x="390" y="290" width="280" height="350" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(504,310) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m26 5 12 0 2 8 7 4 8-2 6 11-6 6v8l6 6-6 11-8-2-7 4-2 8H26l-2-8-7-4-8 2-6-11 6-6v-8l-6-6 6-11 8 2 7-4Z" transform="translate(3,-3) scale(.9)"/><circle cx="32" cy="30" r="10"/></g><text x="530" y="400" font-size="22" font-weight="700" fill="#253650" text-anchor="middle">Context Engineering</text><rect x="405" y="420" width="250" height="38" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="530" y="446" font-size="19" font-weight="400" fill="#253650" text-anchor="middle">Relevant data</text><rect x="405" y="468" width="250" height="38" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="530" y="494" font-size="19" font-weight="400" fill="#253650" text-anchor="middle">Tool descriptions</text><rect x="405" y="516" width="250" height="38" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="530" y="542" font-size="19" font-weight="400" fill="#253650" text-anchor="middle">System rules</text><rect x="405" y="564" width="250" height="38" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="530" y="590" font-size="19" font-weight="400" fill="#253650" text-anchor="middle">Conversation history</text><rect x="730" y="350" width="280" height="230" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(844.0,368) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 9c-8-10-21-2-18 9C1 21 3 36 12 39c-5 12 8 22 18 14V9Z M34 9c8-10 21-2 18 9 11 3 9 18 0 21 5 12-8 22-18 14V9Z M15 19l7 6-7 9 M49 19l-7 6 7 9 M19 47l5-7 M45 47l-5-7"/></g><text x="870.0" y="448" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">LLM</text><text x="870.0" y="482" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Understand the supplied</text><text x="870.0" y="508" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">context and respond</text><rect x="1070" y="350" width="280" height="230" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(1184.0,368) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h28l10 10v44H14Z M42 4v12h10 M23 26h20 M23 35h20 M23 44h13"/></g><text x="1210.0" y="448" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Better Response</text><text x="1210.0" y="482" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Relevant, accurate and</text><text x="1210.0" y="508" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">aligned with the goal</text><path d="M340 465H375" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M680 465H715" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1020 465H1055" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1210 595V730H190V595" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="592.0" y="709" width="216" height="29" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="700" y="730" font-size="16" font-weight="600" fill="#52749b" text-anchor="middle">Feedback / Context Update</text>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Understand the goal</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Identify the request and the information needed to answer it.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Gather relevant context</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Retrieve useful internal data, tool results and external sources.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Structure the context</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Organize instructions, examples, rules and conversation history.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Generate the response</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Use the assembled context to produce a relevant answer.</text><rect x="40" y="1200" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1206" width="39" height="39" rx="20" fill="#ffeef5" stroke="none" stroke-width="2"/><text x="72.5" y="1234" font-size="22" font-weight="700" fill="#b54c78" text-anchor="middle">5</text><text x="111" y="1232" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Learn and improve</text><text x="470" y="1232" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Use feedback to refine the context provided in later interactions.</text></g></svg>