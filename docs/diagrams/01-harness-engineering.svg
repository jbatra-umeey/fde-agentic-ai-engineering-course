l="#253650" text-anchor="middle">Instructions, tools,</text><text x="435.0" y="503" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">context and rules</text><rect x="580" y="345" width="240" height="225" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(674.0,363) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="17" width="48" height="36" rx="10"/><path d="M32 17V8M2 29v13M62 29v13M23 43h18"/><circle cx="32" cy="5" r="3"/><circle cx="22" cy="31" r="3"/><circle cx="42" cy="31" r="3"/></g><text x="700.0" y="443" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">AI Agent</text><text x="700.0" y="477" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Plan, reason and act</text><rect x="845" y="345" width="240" height="225" rx="20" fill="#fff8d9" stroke="#b58815" stroke-width="2"/><g transform="translate(939.0,363) scale(0.8)" fill="none" stroke="#b58815" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 47C-1 47 0 26 14 26 13 5 44 3 47 24c19-2 22 23 5 23Z"/><path d="M23 35h18 M32 27v16"/></g><text x="965.0" y="443" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Tools &amp; Resources</text><text x="965.0" y="477" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">External tools, APIs</text><text x="965.0" y="503" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">and data</text><rect x="1110" y="345" width="240" height="225" rx="20" fill="#ffeef5" stroke="#b54c78" stroke-width="2"/><g transform="translate(1204.0,363) scale(0.8)" fill="none" stroke="#b54c78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h28l10 10v44H14Z M42 4v12h10 M23 26h20 M23 35h20 M23 44h13"/></g><text x="1230.0" y="443" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Task Output</text><text x="1230.0" y="477" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Result in the right</text><text x="1230.0" y="503" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">format</text><path d="M290 455H310" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M555 455H575" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M820 455H840" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1085 455H1105" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1230 585V690H170V585" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="604.0" y="669" width="192" height="29" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="700" y="690" font-size="16" font-weight="600" fill="#52749b" text-anchor="middle">Feedback &amp; Improvement</text>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Define the goal</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Give the agent a clear task or objective.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Set up the harness</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Provide instructions, tools, context and rules.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Agent takes action</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">The agent plans and decides what to do next.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Use tools and resources</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Access the APIs and data needed to complete the task.</text><rect x="40" y="1200" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1206" width="39" height="39" rx="20" fill="#ffeef5" stroke="none" stroke-width="2"/><text x="72.5" y="1234" font-size="22" font-weight="700" fill="#b54c78" text-anchor="middle">5</text><text x="111" y="1232" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Deliver the result</text><text x="470" y="1232" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Return the result in the format the user needs.</text><rect x="40" y="1260" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1266" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="1294" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">6</text><text x="111" y="1292" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Learn and improve</text><text x="470" y="1292" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Use feedback to improve the harness over time.</text><text x="45" y="1368" font-size="15" font-weight="400" fill="#65778f" text-anchor="start">Conceptual flows: supplied @aiwithanuj reference photos. Original vector artwork for this course.</text><text x="1355" y="1368" font-size="16" font-weight="700" fill="#52749b" text-anchor="end">01 / 10</text></g></svg>