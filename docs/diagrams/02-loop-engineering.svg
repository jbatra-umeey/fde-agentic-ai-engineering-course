<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">2. Loop Engineering</title><desc id="desc">Build a continuous cycle of planning, action, observation and improvement. Flow and step-by-step explanation follow the user-supplied reference photo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#52749b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="1400" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="40" y="38" width="70" height="48" rx="24" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="75" y="71" font-size="27" font-weight="700" fill="#235c9b" text-anchor="middle">2</text><text x="132" y="70" font-size="18" font-weight="700" fill="#52749b" text-anchor="start">FDE AGENTIC AI ENGINEERING COURSE</text><text x="700" y="145" font-size="46" font-weight="700" fill="#10264b" text-anchor="middle">Loop Engineering</text><text x="700" y="191" font-size="23" font-weight="400" fill="#52627b" text-anchor="middle">Build a continuous cycle of planning, action, observation and improvement.</text><rect x="40" y="225" width="212" height="42" rx="20" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="23" font-weight="700" fill="#235c9b" text-anchor="start">Flow diagram</text><rect x="535" y="245" width="330" height="175" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(674.0,263) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M12 54v-8c0-20 40-20 40 0v8Z"/></g><text x="700.0" y="343" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">1. Goal / Task</text><text x="700.0" y="377" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">User gives a task or goal</text><rect x="1000" y="420" width="330" height="175" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(1139.0,438) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 9c-8-10-21-2-18 9C1 21 3 36 12 39c-5 12 8 22 18 14V9Z M34 9c8-10 21-2 18 9 11 3 9 18 0 21 5 12-8 22-18 14V9Z M15 19l7 6-7 9 M49 19l-7 6 7 9 M19 47l5-7 M45 47l-5-7"/></g><text x="1165.0" y="518" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">2. Plan</text><text x="1165.0" y="552" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Break the goal into steps</text><rect x="820" y="650" width="330" height="175" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(959.0,668) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m26 5 12 0 2 8 7 4 8-2 6 11-6 6v8l6 6-6 11-8-2-7 4-2 8H26l-2-8-7-4-8 2-6-11 6-6v-8l-6-6 6-11 8 2 7-4Z" transform="translate(3,-3) scale(.9)"/><circle cx="32" cy="30" r="10"/></g><text x="985.0" y="748" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">3. Act</text><text x="985.0" y="782" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Execute with tools and APIs</text><rect x="250" y="650" width="330" height="175" rx="20" fill="#fff8d9" stroke="#b58815" stroke-width="2"/><g transform="translate(389.0,668) scale(0.8)" fill="none" stroke="#b58815" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="27" cy="26" r="19"/><path d="m41 40 16 17"/></g><text x="415.0" y="748" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">4. Observe</text><text x="415.0" y="782" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Check results and progress</text><rect x="65" y="420" width="330" height="175" rx="20" fill="#ffeef5" stroke="#b54c78" stroke-width="2"/><g transform="translate(204.0,438) scale(0.8)" fill="none" stroke="#b54c78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M53 22A23 23 0 0 0 12 16L6 23 M6 9v14h14 M11 42a23 23 0 0 0 41 6l6-7 M58 55V41H44"/></g><text x="230.0" y="518" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">5. Learn &amp; Improve</text><text x="230.0" y="552" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Reflect and update the plan</text><path d="M880 325H1165V405" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1165 610V620H985V635" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M805 735H595" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M235 735H230V610" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M230 405V325H520" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(665,480) scale(1.1)" fill="none" stroke="#3874aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M53 22A23 23 0 0 0 12 16L6 23 M6 9v14h14 M11 42a23 23 0 0 0 41 6l6-7 M58 55V41H44"/></g><text x="700" y="590" font-size="24" font-weight="700" fill="#3874aa" text-anchor="middle">Continuous loop</text>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Set the goal</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Define the task or objective the agent should achieve.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Plan and decide</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Analyze the goal and break it into actionable steps.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Execute actions</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Use tools, APIs and other resources to carry out the plan.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Check and evaluate</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Review results, check errors and measure progress.</text><rect x="40" y="1200" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1206" width="39" height="39" rx="20" fill="#ffeef5" stroke="none" stroke-width="2"/><text x="72.5" y="1234" font-size="22" font-weight="700" fill="#b54c78" text-anchor="middle">5</text><text x="111" y="1232" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Learn and improve</text><text x="470" y="1232" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Reflect on the outcome, update the plan and repeat.</text><text x="45" y="1368" font-size="15" font-weight="400" fill="#65778f" text-anchor="start">Conceptual flows: supplied @aiwithanuj reference photos. Original vector artwork for this course.</text><text x="1355" y="1368" font-size="16" font-weight="700" fill="#52749b" text-anchor="end">02 / 10</text></g></svg>