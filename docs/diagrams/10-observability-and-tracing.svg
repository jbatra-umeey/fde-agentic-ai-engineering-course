ound" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="990" y="625" width="360" height="200" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(1144.0,643) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6v49h48 M20 44V31h7v13 M34 44V21h7v23 M48 44V11h7v33"/></g><text x="1170.0" y="723" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Monitoring &amp; Analysis</text><text x="1170.0" y="757" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Find issues and analyze</text><text x="1170.0" y="783" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">performance</text><rect x="350" y="625" width="420" height="200" rx="20" fill="#fff8d9" stroke="#b58815" stroke-width="2"/><g transform="translate(534.0,643) scale(0.8)" fill="none" stroke="#b58815" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 44c0-6-12-12-12-23a22 22 0 0 1 44 0c0 11-12 17-12 23Z M23 51h18 M26 58h12 M32 44V30 M23 24l9 6 9-6"/></g><text x="560.0" y="723" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Better Decisions &amp; Improvements</text><text x="560.0" y="757" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Optimize agents, tools and workflows</text><path d="M1210 545V610" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M975 725H785" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M530 610V545" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
