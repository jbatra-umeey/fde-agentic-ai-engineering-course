<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">User request</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Begin with a task or goal for the agentic system.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Execution &amp; instrumentation</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Capture logs, metrics and traces while agents and tools run.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Data collection</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Store telemetry to build a view of the complete request flow.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Monitoring and analysis</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Investigate failures, latency, performance and bottlenecks.</text><rect x="40" y="1200" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1206" width="39" height="39" rx="20" fill="#ffeef5" stroke="none" stroke-width="2"/><text x="72.5" y="1234" font-size="22" font-weight="700" fill="#b54c78" text-anchor="middle">5</text><text x="111" y="1232" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Improvement</text><text x="470" y="1232" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Use the findings to optimize agents, tools and workflows.</text><text x="1355" y="1368" font-size="16" font-weight="700" fill="#52749b" text-anchor="end">10 / 10</text></g></svg>