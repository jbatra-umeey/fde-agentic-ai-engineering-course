<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">8. Evals for Agents</title><desc id="desc">Measure quality, accuracy and safety, then improve the system. Flow and step-by-step explanation follow the user-supplied reference photo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#52749b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="1400" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="40" y="38" width="70" height="48" rx="24" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="75" y="71" font-size="27" font-weight="700" fill="#235c9b" text-anchor="middle">8</text><text x="132" y="70" font-size="18" font-weight="700" fill="#52749b" text-anchor="start">FDE AGENTIC AI ENGINEERING COURSE</text><text x="700" y="145" font-size="46" font-weight="700" fill="#10264b" text-anchor="middle">Evals for Agents</text><text x="700" y="191" font-size="23" font-weight="400" fill="#52627b" text-anchor="middle">Measure quality, accuracy and safety, then improve the system.</text><rect x="40" y="225" width="212" height="42" rx="20" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="23" font-weight="700" fill="#235c9b" text-anchor="start">Flow diagram</text><rect x="50" y="300" width="280" height="220" rx="20" fill="#edf4ff" stroke="#3269c8" stroke-width="2"/><g transform="translate(164.0,318) scale(0.8)" fill="none" stroke="#3269c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M12 54v-8c0-20 40-20 40 0v8Z"/></g><text x="190.0" y="398" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">User Query</text><text x="190.0" y="432" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Task or goal</text><rect x="390" y="300" width="280" height="220" rx="20" fill="#e9faf3" stroke="#238267" stroke-width="2"/><g transform="translate(504.0,318) scale(0.8)" fill="none" stroke="#238267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="17" width="48" height="36" rx="10"/><path d="M32 17V8M2 29v13M62 29v13M23 43h18"/><circle cx="32" cy="5" r="3"/><circle cx="22" cy="31" r="3"/><circle cx="42" cy="31" r="3"/></g><text x="530.0" y="398" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Agent</text><text x="530.0" y="432" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Use tools, plan and act</text><rect x="730" y="300" width="280" height="220" rx="20" fill="#f2edff" stroke="#7653b3" stroke-width="2"/><g transform="translate(844.0,318) scale(0.8)" fill="none" stroke="#7653b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="7" width="46" height="50" rx="7"/><path d="m19 30 9 9 19-20"/></g><text x="870.0" y="398" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Evaluation / Evals</text><text x="870.0" y="432" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Check quality, accuracy</text><text x="870.0" y="458" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">and safety</text><rect x="1070" y="300" width="280" height="220" rx="20" fill="#fff8d9" stroke="#b58815" stroke-width="2"/><g transform="translate(1184.0,318) scale(0.8)" fill="none" stroke="#b58815" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6v49h48 M20 44V31h7v13 M34 44V21h7v23 M48 44V11h7v33"/></g><text x="1210.0" y="398" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Results</text><text x="1210.0" y="432" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Pass/fail and metrics</text><path d="M340 410H375" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M680 410H715" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1020 410H1055" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="675" y="620" width="370" height="200" rx="20" fill="#ffeef5" stroke="#b54c78" stroke-width="2"/><g transform="translate(834.0,638) scale(0.8)" fill="none" stroke="#b54c78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M53 22A23 23 0 0 0 12 16L6 23 M6 9v14h14 M11 42a23 23 0 0 0 41 6l6-7 M58 55V41H44"/></g><text x="860.0" y="718" font-size="21" font-weight="700" fill="#172b4d" text-anchor="middle">Feedback &amp; Improvement</text><text x="860.0" y="752" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">Refine prompts, tools and</text><text x="860.0" y="778" font-size="20" font-weight="400" fill="#253650" text-anchor="middle">policies</text><path d="M1210 535V720H1060" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M660 720H530V535" fill="none" stroke="#52749b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="865" width="1320" height="3" rx="0" fill="#e8eff6" stroke="none" stroke-width="2"/><rect x="40" y="895" width="300" height="45" rx="22" fill="#e8f3ff" stroke="none" stroke-width="2"/><text x="60" y="926" font-size="26" font-weight="700" fill="#235c9b" text-anchor="start">How it works</text>
<rect x="40" y="960" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="966" width="39" height="39" rx="20" fill="#edf4ff" stroke="none" stroke-width="2"/><text x="72.5" y="994" font-size="22" font-weight="700" fill="#3269c8" text-anchor="middle">1</text><text x="111" y="992" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Define the task</text><text x="470" y="992" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Specify the user goal and the behavior to evaluate.</text><rect x="40" y="1020" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1026" width="39" height="39" rx="20" fill="#e9faf3" stroke="none" stroke-width="2"/><text x="72.5" y="1054" font-size="22" font-weight="700" fill="#238267" text-anchor="middle">2</text><text x="111" y="1052" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Run the agent</text><text x="470" y="1052" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Execute the workflow with its tools, plans and actions.</text><rect x="40" y="1080" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1086" width="39" height="39" rx="20" fill="#f2edff" stroke="none" stroke-width="2"/><text x="72.5" y="1114" font-size="22" font-weight="700" fill="#7653b3" text-anchor="middle">3</text><text x="111" y="1112" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Evaluate the output</text><text x="470" y="1112" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Check quality, accuracy, safety and other predefined criteria.</text><rect x="40" y="1140" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1146" width="39" height="39" rx="20" fill="#fff8d9" stroke="none" stroke-width="2"/><text x="72.5" y="1174" font-size="22" font-weight="700" fill="#b58815" text-anchor="middle">4</text><text x="111" y="1172" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Get feedback</text><text x="470" y="1172" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Analyze pass/fail results and metrics to identify improvements.</text><rect x="40" y="1200" width="1320" height="51" rx="12" fill="#f8fafd" stroke="none" stroke-width="2"/><rect x="53" y="1206" width="39" height="39" rx="20" fill="#ffeef5" stroke="none" stroke-width="2"/><text x="72.5" y="1234" font-size="22" font-weight="700" fill="#b54c78" text-anchor="middle">5</text><text x="111" y="1232" font-size="19" font-weight="700" fill="#172b4d" text-anchor="start">Iterate and improve</text><text x="470" y="1232" font-size="19" font-weight="400" fill="#52627b" text-anchor="start">Refine prompts, tools and policies, then evaluate again.</text><text x="45" y="1368" font-size="15" font-weight="400" fill="#65778f" text-anchor="start">Conceptual flows: supplied @aiwithanuj reference photos. Original vector artwork for this course.</text><text x="1355" y="1368" font-size="16" font-weight="700" fill="#52749b" text-anchor="end">08 / 10</text></g></svg>