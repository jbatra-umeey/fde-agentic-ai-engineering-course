name: Course reference validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: make check test eval
      - run: python -m build
      - run: python scripts/dev_credentials.py
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: docker compose exec -T api python /app/scripts/seed.py
      - run: curl --fail http://127.0.0.1:8000/healthz
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: reports/evaluation.json
