name: Publish validated course image
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: course-release
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: make check test eval
      - run: jev-eval --adversarial
      - run: python -m build
      - run: python scripts/dev_credentials.py
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T api python /app/scripts/seed.py
      - run: curl --fail http://127.0.0.1:8000/healthz
      - if: always()
        run: docker compose down
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: actions/upload-artifact@v4
        with:
          name: course-python-distribution
          path: dist/*
